# ==========================================
# 🔌 插件配置清单 (Plugins Configuration)
# 控制各个功能模块的开启状态及运行时参数
# ==========================================

plugins:
  # --------------------------
  # 示例插件: 股票监控 (Stock Monitor)
  # --------------------------
  stock_monitor:
    # 是否启用此插件 (true/false)
    enabled: true
    # 插件专属配置区 (Schema 由插件自身定义)
    config:
      # 数据刷新间隔 (秒)
      update_interval: 60
      # 监控目标列表 (股票代码)
      targets: ["AAPL", "MSFT"]

  # --------------------------
  # 示例插件: 服务器探针 (Server Probe)
  # --------------------------
  server_probe:
    enabled: false
    # config: ... (未启用可不填)
