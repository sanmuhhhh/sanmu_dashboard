# ==========================================
# 🖥️ 系统全局配置 (System Configuration)
# 用于配置服务器、数据库连接、日志等基础设施
# ==========================================

server:
  # 监听地址: 0.0.0.0 表示允许所有 IP 访问 (局域网/外网)
  host: "0.0.0.0"
  # 服务端口号
  port: 8000
  # 调试模式: true 会开启热重载 (Hot Reload) 和详细报错，生产环境请设为 false
  debug: true

database:
  # PostgreSQL 连接字符串
  # 格式: postgresql://user:password@host:port/dbname
  # 示例: postgresql://sanmu:sanmu_password@localhost:5432/sanmu_db
  postgres_dsn: "postgresql://sanmu:sanmu_password@localhost:5432/sanmu_db"
  
  # 连接池配置（可选）
  pool_size: 10          # 连接池大小
  max_overflow: 20       # 最大溢出连接数
  pool_timeout: 30       # 获取连接超时时间（秒）
  pool_recycle: 3600     # 连接回收时间（秒，防止连接过期）

  # Redis 连接字符串
  # 用于缓存、Celery 任务队列和 WebSocket 消息分发
  redis_url: "redis://localhost:6379/0"

logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # 日志格式: "text" (适合人类阅读) 或 "json" (适合机器解析/ELK)
  format: "json"
